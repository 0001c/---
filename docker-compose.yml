services:
  web:
    build: .
    image: ximeng-tiaoji-web:latest
    container_name: ximeng-tiaoji
    ports:
      - "5000:5000"
    environment:
      - ARK_API_KEY=${ARK_API_KEY}
      - TZ=Asia/Shanghai
    volumes:
      # 持久化上传和输出目录
      - ./docker-data/uploads:/app/uploads
      - ./docker-data/output:/app/output
    restart: unless-stopped
